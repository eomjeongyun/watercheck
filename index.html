<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a957">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WaterCheck">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>WaterCheck</title>
</head>
<body>
  <main class="app-shell">
    <div id="category-screens"></div>

    <section id="calendar-screen" class="screen" aria-labelledby="calendar-title" hidden>
      <header class="calendar-header">
        <div>
          <p class="eyebrow">나의 음료 기록</p>
          <h2 id="calendar-title">달력</h2>
        </div>
      </header>
      <div class="month-nav">
        <button id="prev-month" type="button" aria-label="이전 달">이전</button>
        <strong id="month-label"></strong>
        <button id="next-month" type="button" aria-label="다음 달">다음</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="grid"></div>
      <div class="calendar-key"><span class="key-ring"></span>2L 달성 <span class="key-dot"></span>기록 있음</div>
      <div id="day-detail" class="day-detail" hidden></div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="주요 메뉴">
    <button class="tab water active" data-screen="water" type="button"><span class="tab-icon cup-icon" aria-hidden="true"></span><span>물</span></button>
    <button class="tab coffee" data-screen="coffee" type="button"><span class="tab-icon cup-icon" aria-hidden="true"></span><span>커피</span></button>
    <button class="tab tea" data-screen="tea" type="button"><span class="tab-icon cup-icon" aria-hidden="true"></span><span>차</span></button>
    <button class="tab calendar" data-screen="calendar" type="button"><span class="tab-icon calendar-icon" aria-hidden="true"></span><span>달력</span></button>
  </nav>
  <script src="./app.js" defer></script>
</body>
</html>
